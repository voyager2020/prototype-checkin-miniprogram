<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>打卡小程序 · 原型</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Roboto, sans-serif;
      background: #f0f0f0;
      display: flex; flex-direction: column;
      color: #1a1a1a;
    }

    /* ── Top Bar ── */
    .topbar {
      height: 44px; background: #1a1a1a;
      display: flex; align-items: center; padding: 0 14px; gap: 10px;
      flex-shrink: 0; border-bottom: 1px solid #2d2d2d;
    }
    .tb-logo { color: #fff; font-size: 13px; font-weight: 700; letter-spacing: 0.3px; }
    .tb-sep  { width: 1px; height: 16px; background: #3a3a3a; }
    .tb-tag  { font-size: 11px; color: #777; }
    .tb-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .nav-btn {
      width: 26px; height: 26px; border-radius: 5px;
      border: 1px solid #333; background: #252525; color: #666;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 10px; transition: all .15s;
    }
    .nav-btn:hover:not(:disabled) { background: #333; color: #aaa; }
    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .page-crumb {
      font-size: 11px; color: #aaa; background: #252525;
      border: 1px solid #333; padding: 3px 10px; border-radius: 4px;
      max-width: 140px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ── Layout ── */
    .main { flex: 1; display: flex; overflow: hidden; }

    /* ── Left Sidebar ── */
    .sidebar {
      width: 320px; background: #fff; border-right: 1px solid #e8e8e8;
      display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto;
    }
    .sidebar::-webkit-scrollbar { display: none; }
    .sb-section {
      padding: 12px 14px 5px; font-size: 10px; font-weight: 700;
      letter-spacing: 1.5px; text-transform: uppercase; color: #bbb;
    }
    .page-item {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 12px 7px 14px; cursor: pointer;
      font-size: 12.5px; color: #444; transition: background .1s;
      border-left: 3px solid transparent; user-select: none;
      min-height: 34px;
    }
    .page-item:hover { background: #f8f8f8; }
    .page-item.active {
      background: #f5f5f5; color: #111; font-weight: 600;
      border-left-color: #111;
    }
    .pi-icon  { font-size: 13px; width: 20px; text-align: center; flex-shrink: 0; color: #555; }
    .pi-label { flex: 1; }
    .pi-num   { font-size: 10px; color: #ccc; }
    .page-item.active .pi-num { color: #888; }
    .sb-footer {
      margin: 8px 12px 14px; padding: 10px 12px;
      background: #f7f7f7; border-radius: 8px;
      font-size: 10.5px; color: #999; line-height: 1.85;
      border: 1px solid #eee;
    }

    /* ── Canvas ── */
    .canvas {
      flex: 1; min-height: 0; background: #e4e4e4; display: flex;
      align-items: center; justify-content: center;
      overflow: hidden; position: relative;
      background-image: radial-gradient(circle, #d0d0d0 1px, transparent 1px);
      background-size: 22px 22px;
    }
    /* 全宽 iframe：占满画布，避免 flex 居中导致高度坍塌 */
    .canvas-full {
      flex: 1; align-self: stretch; width: 100%; min-height: 0;
      display: flex; flex-direction: column;
    }
    .canvas-full iframe { flex: 1; width: 100%; min-height: 0; border: none; display: block; background: #fff; }
    .phone-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .phone-label { font-size: 11px; color: #888; font-weight: 500; letter-spacing: 0.3px; }

    /* Phone Frame */
    .device {
      position: relative; background: #111; border-radius: 44px; padding: 12px;
      box-shadow: 0 0 0 1px #222, 0 24px 60px rgba(0,0,0,0.38),
                  inset 0 0 0 1px rgba(255,255,255,0.05);
      width: 356px; height: 752px;
    }
    .device-notch {
      position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 108px; height: 24px; background: #111;
      border-radius: 0 0 16px 16px; z-index: 10;
    }
    .device-btn { position: absolute; background: #222; }
    .device-btn-v1 { left: -3px; top: 104px; width: 3px; height: 28px; border-radius: 2px 0 0 2px; }
    .device-btn-v2 { left: -3px; top: 142px; width: 3px; height: 28px; border-radius: 2px 0 0 2px; }
    .device-btn-pw { right: -3px; top: 136px; width: 3px; height: 46px; border-radius: 0 2px 2px 0; }
    .device-screen {
      width: 100%; height: 100%; background: #fff;
      border-radius: 33px; overflow: hidden;
    }
    .device-frame { width: 100%; height: 100%; border: none; display: block; }

    /* ── Right Notes Panel ── */
    .notes-panel {
      width: 320px; flex: 0 0 320px; min-height: 0;
      background: #fff; border-left: 1px solid #e8e8e8;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    /* 包裹 header + 可滚动内容，使 flex 子项获得明确高度 budget */
    .np-inner {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .np-header {
      padding: 14px 16px 12px; border-bottom: 1px solid #f0f0f0; flex-shrink: 0;
    }
    .np-page-title {
      font-size: 13px; font-weight: 700; color: #111; margin-bottom: 4px;
    }
    .np-badge {
      display: inline-block; font-size: 10px; background: #f0f0f0;
      color: #666; padding: 2px 8px; border-radius: 3px; font-weight: 600;
    }
    .np-content {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 0 0 20px;
    }
    .np-content::-webkit-scrollbar { width: 5px; }
    .np-content::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
    .np-section-title {
      padding: 14px 16px 8px; font-size: 10px; font-weight: 700;
      letter-spacing: 1.2px; text-transform: uppercase; color: #bbb;
      display: flex; align-items: center; gap: 5px;
    }
    .np-item {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 5px 16px; font-size: 13.5px; color: #1a6b8a; line-height: 1.65;
    }
    .np-bullet {
      width: 5px; height: 5px; border-radius: 50%; background: #7ab8cc;
      flex-shrink: 0; margin-top: 7px;
    }
    .np-divider { height: 1px; background: #f2f2f2; margin: 6px 16px; }
    .np-empty-wrap {
      align-items: center;
      justify-content: center;
    }
    .np-empty { padding: 28px 16px; text-align: center; color: #ccc; font-size: 12px; }

    [v-cloak] { display: none; }
  </style>
</head>
<body>
<div id="app" v-cloak style="height:100%; display:flex; flex-direction:column;">

  <!-- Top Bar -->
  <div class="topbar">
    <span class="tb-logo">打卡小程序</span>
    <div class="tb-sep"></div>
    <span class="tb-tag">线框原型 · 共 {{ screenCount }} 个界面</span>
    <div class="tb-right">
      <button class="nav-btn" @click="goBack" :disabled="idx <= 0" title="返回">
        <i class="fas fa-chevron-left"></i>
      </button>
      <button class="nav-btn" @click="goForward" :disabled="idx >= hist.length - 1" title="前进">
        <i class="fas fa-chevron-right"></i>
      </button>
      <div class="page-crumb">{{ cur.icon }} {{ cur.label }}</div>
    </div>
  </div>

  <!-- Main -->
  <div class="main">

    <!-- ① 左侧：页面树（分组 + 全量节点，二级/三级与一级同一套选中样式） -->
    <div class="sidebar">
      <div v-for="(p, idx) in pages" :key="p.id">
        <div v-if="showSection(idx)" class="sb-section">{{ p.section }}</div>
        <div
          class="page-item" :class="{ active: curId === p.id }"
          :style="{ paddingLeft: (14 + (p.depth || 0) * 14) + 'px' }"
          @click="go(p.key, p.params||'')">
          <span class="pi-icon">{{ treeIcon(p) }}</span>
          <span class="pi-label">{{ p.label }}</span>
          <span class="pi-num">P{{ p.pNum }}</span>
        </div>
      </div>
      <div style="margin: 6px 12px 0; border-top: 1px solid #f0f0f0;"></div>
      <div class="sb-footer">
        线框原型 · 黑白灰<br>
        TDesign 微信小程序<br>
        NavBar 44px · Cell 56px<br>
        TabBar 50px
      </div>
    </div>

    <!-- ② 中间：手机预览 / 全宽视图 -->
    <div class="canvas" style="overflow:hidden;">

      <!-- 全宽模式（业务流程等无需手机框的页面） -->
      <template v-if="cur.fullCanvas">
        <div class="canvas-full">
          <iframe :src="iframeSrc"></iframe>
        </div>
      </template>

      <!-- 手机框模式（普通页面） -->
      <template v-else>
        <div class="phone-wrap">
          <div class="phone-label">{{ cur.label }}</div>
          <div class="device">
            <div class="device-notch"></div>
            <div class="device-btn device-btn-v1"></div>
            <div class="device-btn device-btn-v2"></div>
            <div class="device-btn device-btn-pw"></div>
            <div class="device-screen">
              <iframe :src="iframeSrc" class="device-frame"
                style="width:332px; height:728px; border:none; display:block;
                       transform-origin: top left;"></iframe>
            </div>
          </div>
        </div>
      </template>

    </div>

    <!-- ③ 右侧：交互说明 -->
    <div class="notes-panel">
      <div v-if="note" key="has-note" class="np-inner">
        <div class="np-header">
          <div class="np-page-title">{{ cur.icon }} {{ cur.label }}</div>
          <span class="np-badge">交互说明</span>
        </div>
        <div class="np-content">

          <!-- 交互说明列表 -->
          <div class="np-section-title">
            <i class="fas fa-hand-pointer" style="font-size:11px; color:#bbb;"></i>
            交互行为
          </div>
          <div v-for="item in note.interactions" :key="item" class="np-item">
            <div class="np-bullet"></div>
            <span>{{ item }}</span>
          </div>

        </div>
      </div>
      <div v-else class="np-inner np-empty-wrap">
        <div class="np-empty">
          <i class="fas fa-comment-dots" style="font-size:22px; margin-bottom:8px; display:block;"></i>
          暂无说明
        </div>
      </div>
    </div>

  </div>
</div>

<script src="assets/js/vue.js"></script>

new Vue({
  el: '#app',
  data: {
    pages: PAGES,
    curId: 'home',
    hist: ['home'],
    idx: 0,
  },
  computed: {
    cur() { return this.pages.find(p => p.id === this.curId) || this.pages[0]; },
    note() { return NOTES[this.cur.key] || null; },
    iframeSrc() {
      var p = this.cur;
      return 'pages/' + p.key + '.html' + (p.params ? '?' + p.params : '');
    },
    screenCount() {
      return this.pages.length;
    },
  },
  mounted() {
    window.addEventListener('message', e => {
      if (e.data && e.data.navigate) this.go(e.data.navigate, e.data.params || '');
    });
  },
  methods: {
    showSection(idx) {
      return idx === 0 || this.pages[idx].section !== this.pages[idx - 1].section;
    },
    treeIcon(p) {
      if (p.icon) return p.icon;
      var d = p.depth || 0;
      if (d >= 2) return '⤷';
      if (d === 1) return '↳';
      return '·';
    },
    go(k, params) {
      var id = k + (params ? '#' + params : '');
      // 若拼接 id 未命中（含参数拼错），优先落到 id===key 的规范页，再按 key 首次出现降级
      if (!this.pages.find(p => p.id === id)) {
        var found = this.pages.find(p => p.id === k)
          || this.pages.find(p => p.key === k);
        if (!found) return;
        id = found.id;
      }
      if (id === this.curId) return;
      this.hist = this.hist.slice(0, this.idx + 1);
      this.hist.push(id);
      this.idx = this.hist.length - 1;
      this.curId = id;
    },
    goBack() {
      if (this.idx > 0) { this.idx--; this.curId = this.hist[this.idx]; }
    },
    goForward() {
      if (this.idx < this.hist.length - 1) { this.idx++; this.curId = this.hist[this.idx]; }
    },
  },
});
</script>
