<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>打卡统计</title>
  <link rel="stylesheet" href="../assets/td.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    .heat-cell{aspect-ratio:1;border-radius:3px;cursor:pointer;}
    .h0{background:var(--td-bg-page);border:1px solid var(--td-border);}
    .h1{background:#D0D0D0;}
    .h2{background:#888;}
    .h3{background:#1a1a1a;}
    .h-today{box-shadow:0 0 0 2px var(--td-text-1);}
  </style>
</head>
<body style="display:flex;flex-direction:column;height:100vh;overflow:hidden;background:var(--td-bg-page);">
<div id="app" v-cloak style="display:flex;flex-direction:column;height:100%;">

  <div class="td-navbar">
    <div class="td-statusbar"></div>
    <div class="td-navbar-content">
      <span class="td-navbar-title">打卡统计</span>
      <div class="td-navbar-action" style="right:12px;">
        <div class="td-segment" style="min-width:76px;">
          <div v-for="d in dims" :key="d.k" class="td-segment-item" :class="dim===d.k?'active':''" @click="dim=d.k">{{ d.l }}</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Summary -->
  <div style="display:flex;border-bottom:1px solid var(--td-border);background:var(--td-bg-card);">
    <div style="flex:1;padding:12px 10px;text-align:center;border-right:1px solid var(--td-border);">
      <div style="font-size:22px;font-weight:800;color:var(--td-text-1);">12</div>
      <div style="font-size:11px;color:var(--td-text-3);margin-top:3px;">连续天数</div>
    </div>
    <div style="flex:1;padding:12px 10px;text-align:center;border-right:1px solid var(--td-border);">
      <div style="font-size:22px;font-weight:800;color:var(--td-text-1);">47</div>
      <div style="font-size:11px;color:var(--td-text-3);margin-top:3px;">累计天数</div>
    </div>
    <div style="flex:1;padding:12px 10px;text-align:center;">
      <div style="font-size:22px;font-weight:800;color:var(--td-text-1);">86%</div>
      <div style="font-size:11px;color:var(--td-text-3);margin-top:3px;">本月完成率</div>
    </div>
  </div>

  <div style="flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:12px;" class="no-sb">

    <!-- 热力图 -->
    <div class="td-card">
      <div class="td-card-header" style="display:flex;justify-content:space-between;align-items:center;">
        <span>{{ currentMonth }} 热力图</span>
        <div style="display:flex;align-items:center;gap:3px;font-size:10px;color:var(--td-text-3);">
          <span>少</span>
          <div style="width:10px;height:10px;border-radius:2px;background:var(--td-bg-page);border:1px solid var(--td-border);"></div>
          <div style="width:10px;height:10px;border-radius:2px;" class="h1"></div>
          <div style="width:10px;height:10px;border-radius:2px;" class="h2"></div>
          <div style="width:10px;height:10px;border-radius:2px;" class="h3"></div>
          <span>多</span>
        </div>
      </div>
      <div class="td-card-body" style="padding-top:8px;">
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px;">
          <div v-for="w in ['日','一','二','三','四','五','六']" :key="w" style="text-align:center;font-size:10px;color:var(--td-text-3);">{{ w }}</div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;">
          <div v-for="c in cells" :key="c.k"
            class="heat-cell" :class="['h'+c.heat, c.today?'h-today':'']"
            :style="!c.d?'opacity:0;pointer-events:none':''"
            @click="c.d&&selectDay(c)">
            <div v-if="c.d" style="text-align:center;font-size:9px;padding-top:1px;color:rgba(0,0,0,0.35);line-height:1;">{{ c.d }}</div>
          </div>
        </div>
        <div v-if="sel" style="margin-top:10px;background:var(--td-bg-page);border-radius:var(--td-radius-m);padding:10px;border:1px solid var(--td-border);">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <span style="font-size:13px;font-weight:600;color:var(--td-text-1);">{{ sel.label }}</span>
            <span @click="sel=null" style="color:var(--td-text-3);cursor:pointer;font-size:12px;"><i class="fas fa-times"></i></span>
          </div>
          <div v-for="r in sel.recs" :key="r.n" style="display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--td-border);">
            <span style="font-size:15px;">{{ r.icon }}</span>
            <div style="flex:1;">
              <div style="font-size:12px;font-weight:600;color:var(--td-text-1);">{{ r.n }}</div>
              <div style="font-size:11px;color:var(--td-text-3);">{{ r.t }}{{ r.th?' · '+r.th:'' }}</div>
            </div>
            <i class="fas fa-check-circle" style="color:var(--td-text-2);font-size:14px;"></i>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- TabBar：今日 | 打卡项 | 我的（统计已合并到「我的」，此页从左侧导航进入） -->
  <div class="td-tabbar">
    <div class="td-tab-item" @click="_nav('home')"><i class="fas fa-list-check"></i><span>今日</span></div>
    <div class="td-tab-item" @click="_nav('checkin-list')"><i class="fas fa-border-all"></i><span>打卡项</span></div>
    <div class="td-tab-item" @click="_nav('profile')"><i class="fas fa-user"></i><span>我的</span></div>
  </div>

</div>
<script src="../assets/js/vue.js"></script>
<script>
function _nav(p){if(window.parent!==window)window.parent.postMessage({navigate:p},'*');}
new Vue({
  el:'#app',
  data:{
    dim:'month',sel:null,
    dims:[{k:'month',l:'月'},{k:'year',l:'年'}],
    recs:{
      8:[{icon:'📚',n:'每日阅读',t:'07:30',th:'读完了第5章'}],
      10:[{icon:'📚',n:'每日阅读',t:'08:00',th:''},{icon:'🏃',n:'晨跑5公里',t:'07:10',th:''}],
    }
  },
  computed:{
    currentMonth(){const d=new Date();return`${d.getFullYear()}年${d.getMonth()+1}月`;},
    cells(){
      const now=new Date(),y=now.getFullYear(),m=now.getMonth();
      const fd=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate();
      const cs=[];
      for(let i=0;i<fd;i++)cs.push({k:'e'+i,d:0,heat:0,today:false});
      const hs=[0,1,2,3,2,1,3,0,1,2,3,1,2,0,1,3,2,1,0,2,3,1,2,3,2,1,0,1,2,3,1];
      for(let d=1;d<=dim;d++)cs.push({k:d,d,heat:d<=now.getDate()?hs[(d-1)%hs.length]:0,today:d===now.getDate()});
      return cs;
    }
  },
  methods:{
    selectDay(c){
      if(!c.d)return;
      const rs=this.recs[c.d]||[];
      if(!rs.length){this.sel=null;return;}
      const m=new Date().getMonth()+1;
      this.sel={label:`${m}月${c.d}日的打卡记录`,recs:rs};
    }
  }
});
</script>
</body>
</html>
