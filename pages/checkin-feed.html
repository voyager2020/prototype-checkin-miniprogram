<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>全部打卡动态</title>
  <link rel="stylesheet" href="../assets/td.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body style="display:flex;flex-direction:column;height:100vh;overflow:hidden;background:var(--td-bg-page);">
<div id="app" v-cloak style="display:flex;flex-direction:column;height:100%;">

  <div class="td-navbar">
    <div class="td-statusbar"></div>
    <div class="td-navbar-content">
      <div class="td-navbar-back" @click="_nav('checkin-detail')"><i class="fas fa-chevron-left"></i></div>
      <span class="td-navbar-title">全部打卡动态</span>
    </div>
  </div>

  <div style="flex:1;overflow-y:auto;padding:12px 16px;" class="no-sb">

    <!-- 空态 -->
    <div v-if="isEmpty" style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 24px;text-align:center;">
      <i class="fas fa-newspaper" style="font-size:44px;color:#e0e0e0;margin-bottom:16px;"></i>
      <div style="font-size:15px;font-weight:600;color:var(--td-text-2);margin-bottom:8px;">暂无打卡动态</div>
      <div style="font-size:13px;color:var(--td-text-3);line-height:1.6;">今日还没有成员完成打卡<br>快去鼓励大家吧 💪</div>
    </div>

    <div v-for="grp in (isEmpty ? [] : groups)" :key="grp.date" style="margin-bottom:16px;">
      <div style="display:flex;align-items:center;gap:6px;padding:5px 0 10px;">
        <div style="width:6px;height:6px;border-radius:50%;background:var(--td-text-1);flex-shrink:0;"></div>
        <span style="font-size:12px;font-weight:700;color:var(--td-text-2);">{{ grp.label }}</span>
        <span style="font-size:11px;color:var(--td-text-3);">{{ grp.count }} 条</span>
      </div>
      <div v-for="item in grp.items" :key="item.id" class="td-card" style="margin-bottom:8px;">
        <div style="padding:12px 14px;display:flex;align-items:flex-start;gap:10px;">
          <div style="width:36px;height:36px;border-radius:50%;background:var(--td-bg-page);border:1px solid var(--td-border);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;">{{ item.av }}</div>
          <div style="flex:1;min-width:0;">
            <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px;">
              <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                <span style="font-size:13px;font-weight:700;color:var(--td-text-1);">{{ item.name }}</span>
                <span class="td-tag td-tag-default" style="font-size:10px;">{{ item.proj }}</span>
                <span style="font-size:11px;color:var(--td-text-3);">第{{ item.day }}天</span>
              </div>
              <span style="font-size:11px;color:var(--td-text-3);flex-shrink:0;">{{ item.time }}</span>
            </div>
            <p v-if="item.thought" style="font-size:12px;color:var(--td-text-2);margin-top:6px;line-height:1.55;">{{ item.thought }}</p>
            <div v-if="item.photos" style="display:flex;gap:6px;margin-top:8px;">
              <div v-for="j in item.photos" :key="j" style="width:60px;height:60px;background:var(--td-bg-page);border:1px solid var(--td-border);border-radius:var(--td-radius-m);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;">📷</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
<script src="../assets/js/vue.js"></script>
<script>
function _nav(p){if(window.parent!==window)window.parent.postMessage({navigate:p},'*');}
new Vue({
  el:'#app',
  data:{
    isEmpty: location.search.indexOf('empty=1') >= 0,
    groups:[
      {date:'2026-05-14',label:'今天 · 2026-05-14',count:5,items:[
        {id:1,av:'🌸',name:'小花',proj:'每日阅读',day:12,time:'09:30',thought:'今天读了《原则》第五章，关于极度透明原则讲得很深刻，值得反复回味。',photos:2},
        {id:2,av:'🦁',name:'阿杰',proj:'晨跑5公里',day:5,time:'07:15',thought:'今天配速530，感觉状态不错！',photos:0},
        {id:3,av:'😊',name:'小明',proj:'每日阅读',day:12,time:'08:00',thought:'',photos:1},
        {id:4,av:'🐂',name:'大牛',proj:'健身打卡',day:22,time:'20:30',thought:'练了胸背，哑铃卧推5组，累但充实！',photos:0},
        {id:5,av:'🌺',name:'小红',proj:'每日阅读',day:10,time:'21:00',thought:'睡前阅读20分钟，好习惯！',photos:0},
      ]},
      {date:'2026-05-13',label:'昨天 · 2026-05-13',count:4,items:[
        {id:6,av:'🐼',name:'阿熊',proj:'每日阅读',day:11,time:'08:45',thought:'',photos:0},
        {id:7,av:'🌸',name:'小花',proj:'晨跑5公里',day:4,time:'06:50',thought:'清晨跑步，迎接美好一天！',photos:1},
        {id:8,av:'🦊',name:'阿狐',proj:'健身打卡',day:21,time:'19:00',thought:'腿部训练，深蹲100个！',photos:0},
        {id:9,av:'😊',name:'小明',proj:'健身打卡',day:21,time:'20:15',thought:'',photos:0},
      ]},
    ]
  }
});
</script>
</body>
</html>
