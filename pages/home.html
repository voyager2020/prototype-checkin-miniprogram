<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>今日打卡</title>
  <link rel="stylesheet" href="../assets/td.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    .chip { display:inline-flex; align-items:center; gap:4px; padding:4px 10px; border-radius:100px; font-size:12px; font-weight:500; border:1px solid var(--td-border); background:var(--td-bg-page); color:var(--td-text-2); }
    .task-card { background:var(--td-bg-card); border-radius:var(--td-radius-l); padding:14px; margin-bottom:8px; display:flex; align-items:center; gap:12px; box-shadow:var(--td-shadow-1); }
    /* 已完成略浅，但不整体压低透明度，避免「详情」按钮不易辨认 */
    .task-card.done .task-emoji { opacity: 0.85; }
    .closed-badge { display:inline-flex; align-items:center; gap:3px; padding:1px 6px; border-radius:100px; font-size:10px; font-weight:600; background:var(--td-bg-hover); color:var(--td-text-2); border:1px solid var(--td-border); vertical-align:middle; margin-left:4px; }
    .task-emoji { width:44px; height:44px; background:var(--td-bg-page); border-radius:var(--td-radius-l); display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; border:1px solid var(--td-border); }
    .section-lbl { font-size:11px; font-weight:700; color:var(--td-text-4); letter-spacing:1px; text-transform:uppercase; padding:10px 0 6px; }
  </style>
</head>
<body style="display:flex;flex-direction:column;height:100vh;overflow:hidden;">
<div id="app" v-cloak style="display:flex;flex-direction:column;height:100%;background:var(--td-bg-page);">

  <!-- NavBar -->
  <div class="td-navbar">
    <div class="td-statusbar"></div>
    <div class="td-navbar-content">
      <span class="td-navbar-title">今日打卡</span>
    </div>
  </div>

  <!-- Header：问候 + 数据芯片 -->
  <div style="background:var(--td-bg-card);padding:12px 16px 14px;border-bottom:1px solid var(--td-border);">
    <p style="font-size:11px;color:var(--td-text-3);margin-bottom:4px;">{{ today }}</p>
    <h2 style="font-size:17px;font-weight:700;color:var(--td-text-1);margin-bottom:10px;">{{ greeting }}，小明 👋</h2>
    <div style="display:flex;gap:6px;white-space:nowrap;">
      <span class="chip">✅ 已完成 2 项</span>
      <span class="chip">⏰ 待打卡 3 项</span>
      <span class="chip">🔥 连续 12 天</span>
    </div>
  </div>

  <!-- Task List -->
  <div style="flex:1;overflow-y:auto;padding:0 16px 16px;" class="no-sb">

    <!-- 空态 -->
    <div v-if="isEmpty" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 32px;text-align:center;">
      <i class="fas fa-clipboard-list" style="font-size:44px;color:#e0e0e0;margin-bottom:16px;"></i>
      <div style="font-size:15px;font-weight:600;color:var(--td-text-2);margin-bottom:8px;">今日暂无打卡任务</div>
      <div style="font-size:13px;color:var(--td-text-3);line-height:1.6;margin-bottom:20px;">你还没有加入任何打卡项<br>去「打卡项」页面创建或加入吧</div>
      <button class="td-btn td-btn-outline" style="height:38px;font-size:13px;" @click="_nav('checkin-list')">
        <i class="fas fa-plus" style="margin-right:6px;font-size:11px;"></i>去加入打卡项
      </button>
    </div>

    <template v-else>
    <div class="section-lbl">待完成</div>
    <div v-for="t in pending" :key="t.id" class="task-card">
      <div class="task-emoji">{{ t.icon }}</div>
      <div style="flex:1;min-width:0;">
        <p style="font-size:14px;font-weight:600;color:var(--td-text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
          {{ t.name }}
          <span v-if="t.closed" class="closed-badge"><i class="fas fa-lock" style="font-size:8px;"></i>封闭</span>
        </p>
        <p style="font-size:12px;color:var(--td-text-3);margin-top:3px;">{{ t.time }} · {{ t.n }}人</p>
      </div>
      <button class="td-btn td-btn-primary td-btn-sm" @click="open(t)">打卡</button>
    </div>

    <div class="td-divider-space"></div>
    <div class="section-lbl">已完成</div>
    <div v-for="t in done" :key="t.id" class="task-card done">
      <div class="task-emoji">{{ t.icon }}</div>
      <div style="flex:1;min-width:0;">
        <p style="font-size:14px;font-weight:600;color:var(--td-text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px;">
          {{ t.name }}
          <i class="fas fa-check-circle" style="font-size:14px;color:var(--td-text-2);flex-shrink:0;" title="今日已打卡"></i>
        </p>
        <p style="font-size:12px;color:var(--td-text-3);margin-top:3px;">{{ t.time }} · 今日 {{ t.ct }}</p>
      </div>
      <button type="button" class="td-btn td-btn-outline td-btn-sm" style="flex-shrink:0;" @click="goDetail(t)">详情</button>
    </div>
    </template>
  </div>

  <!-- TabBar：今日 | 打卡项 | 我的 -->
  <div class="td-tabbar">
    <div class="td-tab-item active"><i class="fas fa-list-check"></i><span>今日</span></div>
    <div class="td-tab-item" @click="_nav('checkin-list')"><i class="fas fa-border-all"></i><span>打卡项</span></div>
    <div class="td-tab-item" @click="_nav('profile')"><i class="fas fa-user"></i><span>我的</span></div>
  </div>

</div>
<script src="../assets/js/vue.js"></script>
<script>
function _nav(p, params) {
  if (window.parent !== window) window.parent.postMessage({ navigate: p, params: params || '' }, '*');
}
new Vue({
  el: '#app',
  data: {
    isEmpty: location.search.indexOf('empty=1') >= 0,
    pending: [
      { id:1, icon:'📚', name:'每日阅读30分钟', time:'全天', n:28 },
      { id:2, icon:'🏃', name:'晨跑5公里', time:'06:00-09:00', n:15 },
      { id:3, icon:'💪', name:'健身打卡', time:'全天', n:42 },
      { id:6, icon:'🧘', name:'21天正念冥想营', time:'全天', n:20, closed:true },
    ],
    done: [
      { id:4, icon:'💧', name:'每日喝水2000ml', time:'全天', ct:'09:32' },
      { id:5, icon:'🧘', name:'冥想10分钟', time:'晚间', ct:'08:15' },
    ]
  },
  computed: {
    greeting() { const h = new Date().getHours(); return h<12?'早上好':h<18?'下午好':'晚上好'; },
    today() { const d = new Date(); return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 星期${'日一二三四五六'[d.getDay()]}`; }
  },
  methods: {
    open(t) {
      if (t.closed) { _nav('checkin-closed'); return; }
      _nav('checkin-open');
    },
    goDetail(t) {
      _nav('checkin-detail', 'role=participant');
    },
  }
});
</script>
</body>
</html>
