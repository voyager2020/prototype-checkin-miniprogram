<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>打卡项</title>
  <link rel="stylesheet" href="../assets/td.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    .tab-bar { display:flex; background:var(--td-bg-card); border-bottom:1px solid var(--td-border); }
    .tab-it { flex:1; padding:12px 0; text-align:center; font-size:14px; font-weight:500; cursor:pointer; color:var(--td-text-3); border-bottom:2px solid transparent; transition:all .15s; }
    .tab-it.active { color:var(--td-text-1); border-bottom-color:var(--td-text-1); font-weight:600; }

    /* 卡片容器 */
    .item-card {
      background:var(--td-bg-card); border-radius:var(--td-radius-l);
      margin-bottom:10px; box-shadow:var(--td-shadow-1); overflow:hidden;
    }
    /* 卡片主体 */
    .card-body { padding:14px 14px 12px; }
    /* 卡片底部操作栏 */
    .card-actions {
      display:flex; border-top:1px solid var(--td-border);
    }
    .card-btn {
      flex:1; display:flex; align-items:center; justify-content:center;
      gap:5px; padding:9px 0; font-size:13px; font-weight:500;
      color:var(--td-text-2); cursor:pointer; background:none; border:none;
      transition:background .12s;
    }
    .card-btn:active { background:var(--td-bg-page); }
    .card-btn + .card-btn { border-left:1px solid var(--td-border); }
    .card-btn i { font-size:12px; color:var(--td-text-3); }
    .card-btn.primary { color:var(--td-text-1); font-weight:600; }
    .card-btn.primary i { color:var(--td-text-2); }
    .card-btn.disabled { color:var(--td-text-4); cursor:not-allowed; }
    .card-btn.disabled i { color:var(--td-text-4); }
    .card-btn.disabled:active { background:none; }

    /* 成员头像串 */
    .av-stack { display:flex; }
    .av-item { width:20px; height:20px; border-radius:50%; background:var(--td-bg-page); border:1.5px solid #fff; display:flex; align-items:center; justify-content:center; font-size:11px; margin-left:-4px; }
    .av-item:first-child { margin-left:0; }
    .status-tag { flex-shrink:0; margin-top:1px; }
    .item-icon-wrap { position:relative; flex-shrink:0; }
    .today-dot {
      position:absolute; right:-2px; bottom:-2px;
      width:18px; height:18px; border-radius:50%;
      background:var(--td-bg-card); border:1.5px solid var(--td-border);
      display:flex; align-items:center; justify-content:center;
      font-size:10px;
    }
    .today-dot.done { color:var(--td-text-1); border-color:var(--td-text-1); }
    .today-dot.undone { color:var(--td-text-4); }

    .list-progress-wrap { height:5px; background:#E8E8E8; border-radius:100px; overflow:hidden; }
    .list-progress-fill { height:100%; border-radius:100px; background:#56B396; transition:width .3s; }
  </style>
</head>
<body style="display:flex;flex-direction:column;height:100vh;overflow:hidden;background:var(--td-bg-page);">
<div id="app" v-cloak style="display:flex;flex-direction:column;height:100%;">

  <!-- NavBar -->
  <div class="td-navbar">
    <div class="td-statusbar"></div>
    <div class="td-navbar-content">
      <span class="td-navbar-title">打卡项</span>
      <div class="td-navbar-action" @click="_nav('create-checkin')" style="right:12px;width:auto;">
        <span style="font-size:13px;font-weight:600;color:var(--td-text-1);">＋ 发起</span>
      </div>
    </div>
  </div>

  <!-- Tab -->
  <div class="tab-bar">
    <div v-for="t in tabs" :key="t.k" class="tab-it" :class="cur===t.k?'active':''" @click="cur=t.k">{{ t.l }}</div>
  </div>

  <div style="flex:1;overflow-y:auto;padding:12px 16px;" class="no-sb">

    <!-- 空态 -->
    <div v-if="isEmpty" style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px;text-align:center;">
      <i class="fas fa-border-all" style="font-size:44px;color:#e0e0e0;margin-bottom:16px;"></i>
      <div style="font-size:15px;font-weight:600;color:var(--td-text-2);margin-bottom:8px;">暂无打卡项</div>
      <div style="font-size:13px;color:var(--td-text-3);line-height:1.6;margin-bottom:20px;">还没有参与或创建任何打卡挑战<br>点击右上角发起一个吧</div>
      <button class="td-btn td-btn-outline" style="height:38px;font-size:13px;" @click="_nav('create-checkin')">
        <i class="fas fa-plus" style="margin-right:6px;font-size:11px;"></i>发起打卡
      </button>
    </div>

    <!-- ── 我参与的 ── -->
    <template v-if="!isEmpty && cur==='joined'">
      <div v-for="item in joined" :key="item.id" class="item-card">
        <!-- 主体信息 -->
        <div class="card-body">
          <div style="display:flex;align-items:flex-start;gap:12px;">
            <!-- 图标 + 今日打卡角标 -->
            <div class="item-icon-wrap">
              <div style="width:46px;height:46px;background:var(--td-bg-page);border-radius:var(--td-radius-l);display:flex;align-items:center;justify-content:center;font-size:24px;border:1px solid var(--td-border);">{{ item.icon }}</div>
              <div class="today-dot" v-if="item.status!=='ended'" :class="item.todayDone?'done':'undone'" :title="item.todayDone?'今日已打卡':'今日未打卡'">
                <i :class="item.todayDone?'fas fa-check':'far fa-circle'"></i>
              </div>
            </div>
            <div style="flex:1;min-width:0;">
              <!-- 名称 + 打卡项状态 -->
              <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
                <span style="font-size:14px;font-weight:600;color:var(--td-text-1);line-height:1.4;">{{ item.name }}</span>
                <span class="td-tag status-tag" :class="statusTagClass(item.status)">{{ statusLabel(item.status) }}</span>
              </div>
              <!-- 累计次数 -->
              <div style="display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap;">
                <span style="font-size:12px;color:var(--td-text-3);">已打卡 {{ item.checkinCount }} 次</span>
                <span style="font-size:12px;color:var(--td-text-3);">· 第 {{ item.day }} 天</span>
                <span v-if="item.isOwner" style="font-size:11px;color:var(--td-text-4);">· 我发起</span>
              </div>
              <!-- 个人完成进度 -->
              <div style="margin-top:10px;">
                <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--td-text-3);margin-bottom:4px;">
                  <span>已打卡{{ item.checkinCount }}天</span>
                  <span>完成率：{{ joinedCompletionRate(item) }}%</span>
                </div>
                <div class="list-progress-wrap"><div class="list-progress-fill" :style="'width:'+joinedProgressWidth(item)+'%;'"></div></div>
              </div>
              <!-- 成员头像 -->
              <div style="display:flex;align-items:center;gap:5px;margin-top:10px;">
                <div class="av-stack">
                  <div v-for="(m,i) in item.ms.slice(0,3)" :key="i" class="av-item">{{ m }}</div>
                </div>
                <span style="font-size:11px;color:var(--td-text-3);">{{ item.total }} 人参与</span>
              </div>
            </div>
          </div>
        </div>
        <!-- 操作按钮栏 -->
        <div class="card-actions">
          <button class="card-btn" @click="showT('调起微信分享...')">
            <i class="fas fa-share-nodes"></i> 分享
          </button>
          <button v-if="item.isOwner" class="card-btn" :class="{ disabled: item.status==='ended' }" @click="editItem(item)">
            <i class="fas fa-pen"></i> 修改
          </button>
          <button class="card-btn primary" @click="openDetail(item)">
            <i class="fas fa-chevron-right"></i> 详情
          </button>
        </div>
      </div>
    </template>

    <!-- ── 我发起的 ── -->
    <template v-if="!isEmpty && cur==='created'">
      <div v-for="item in created" :key="item.id" class="item-card">
        <!-- 主体信息 -->
        <div class="card-body">
          <div style="display:flex;align-items:flex-start;gap:12px;">
            <!-- 图标 -->
            <div style="width:46px;height:46px;background:var(--td-bg-page);border-radius:var(--td-radius-l);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;border:1px solid var(--td-border);">{{ item.icon }}</div>
            <div style="flex:1;min-width:0;">
              <!-- 名称 + 打卡项状态 -->
              <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
                <span style="font-size:14px;font-weight:600;color:var(--td-text-1);line-height:1.4;">{{ item.name }}</span>
                <span class="td-tag status-tag" :class="statusTagClass(item.status)">{{ statusLabel(item.status) }}</span>
              </div>
              <!-- 天数 -->
              <div style="display:flex;align-items:center;gap:6px;margin-top:6px;">
                <span style="font-size:12px;color:var(--td-text-3);">第 {{ item.day }} 天</span>
              </div>
              <!-- 今日打卡人数 -->
              <div style="margin-top:10px;">
                <div style="font-size:11px;color:var(--td-text-3);margin-bottom:4px;">
                  {{ createdProgressLabel(item) }}：{{ item.doneToday }}/{{ item.total }}人
                </div>
                <div class="list-progress-wrap"><div class="list-progress-fill" :style="'width:'+todayRate(item)+'%;'"></div></div>
              </div>
              <!-- 成员头像 -->
              <div style="display:flex;align-items:center;gap:5px;margin-top:10px;">
                <div class="av-stack">
                  <div v-for="(m,i) in item.ms.slice(0,3)" :key="i" class="av-item">{{ m }}</div>
                </div>
                <span style="font-size:11px;color:var(--td-text-3);">{{ item.total }} 人参与</span>
              </div>
            </div>
          </div>
        </div>
        <!-- 操作按钮栏：三个 -->
        <div class="card-actions">
          <button class="card-btn" @click="showT('调起微信分享...')">
            <i class="fas fa-share-nodes"></i> 分享
          </button>
          <button class="card-btn" :class="{ disabled: item.status==='ended' }" @click="editItem(item)">
            <i class="fas fa-pen"></i> 修改
          </button>
          <button class="card-btn primary" @click="openDetail(item)">
            <i class="fas fa-chevron-right"></i> 详情
          </button>
        </div>
      </div>
    </template>

  </div>

  <!-- TabBar -->
  <div class="td-tabbar">
    <div class="td-tab-item" @click="_nav('home')"><i class="fas fa-list-check"></i><span>今日</span></div>
    <div class="td-tab-item active"><i class="fas fa-border-all"></i><span>打卡项</span></div>
    <div class="td-tab-item" @click="_nav('profile')"><i class="fas fa-user"></i><span>我的</span></div>
  </div>

  <div v-if="toast" class="td-toast">{{ toast }}</div>
</div>
<script src="../assets/js/vue.js"></script>
<script>
function _nav(p, params) {
  if (window.parent !== window) window.parent.postMessage({ navigate: p, params: params || '' }, '*');
}
new Vue({
  el: '#app',
  data: {
    isEmpty: location.search.indexOf('empty=1') >= 0,
    cur: 'joined',
    toast: '',
    tabs: [{ k:'joined', l:'我参与的' }, { k:'created', l:'我发起的' }],
    joined: [
      { id:1, icon:'📚', name:'每日阅读30分钟', status:'active',  day:12, todayDone:false, checkinCount:11, doneToday:19, total:28, ms:['😊','🐯','🦁'], closed:true },
      { id:2, icon:'🏃', name:'晨跑5公里挑战',  status:'active',  day:5,  todayDone:true,  checkinCount:5,  doneToday:11, total:15, ms:['🐼','🦊','🐰'], closed:false },
      { id:4, icon:'💧', name:'每日喝水打卡',  status:'active',  day:8,  todayDone:true,  checkinCount:7,  doneToday:9,  total:12, ms:['🐼','🌸','🦊','🐶'], isOwner:true, closed:true },
      { id:5, icon:'🧘', name:'正念冥想挑战', status:'ended',  day:14, todayDone:true,  checkinCount:14, doneToday:8,  total:8,  ms:['😊','🌺','🦁'], isOwner:true, closed:true },
      { id:3, icon:'💪', name:'健身打卡',        status:'pending', day:0,  todayDone:false, checkinCount:0,  doneToday:0,  total:42, ms:['🐸','🐱','🐶'], closed:false },
    ],
    created: [
      { id:4, icon:'💧', name:'每日喝水打卡',  status:'active', day:8,  doneToday:9,  total:12, ms:['🐼','🌸','🦊','🐶'], closed:true },
      { id:5, icon:'🧘', name:'正念冥想挑战', status:'ended',  day:14, doneToday:8,  total:8,  ms:['😊','🌺','🦁','🐰'], closed:true },
    ]
  },
  methods: {
    createdProgressLabel: function(item) {
      return item.status === 'ended' ? '最后一天打卡人数' : '今日打卡人数';
    },
    joinedCompletionRate: function(item) {
      if (!item.day) return '0.0';
      var rate = item.checkinCount / item.day * 100;
      if (rate > 100) rate = 100;
      return rate.toFixed(1);
    },
    joinedProgressWidth: function(item) {
      if (!item.day) return 0;
      var rate = item.checkinCount / item.day * 100;
      return rate > 100 ? 100 : Math.round(rate);
    },
    openDetail: function(item) {
      var role = this.cur === 'joined' ? 'participant' : 'owner';
      var params = 'role=' + role;
      if (item.closed === false) params += '&mode=open';
      if (item.status === 'ended') params += '&status=ended';
      _nav('checkin-detail', params);
    },
    editItem: function(item) {
      if (item.status === 'ended') { this.showT('已结束的打卡项不可修改'); return; }
      _nav('create-checkin', 'edit=1&name=' + encodeURIComponent(item.name));
    },
    todayRate: function(item) {
      if (!item.total) return 0;
      return Math.round(item.doneToday / item.total * 100);
    },
    statusLabel: function(status) {
      if (status === 'pending') return '待开始';
      if (status === 'active') return '进行中';
      return '已结束';
    },
    statusTagClass: function(status) {
      if (status === 'pending') return 'td-tag-default';
      if (status === 'active') return 'td-tag-success';
      return 'td-tag-warning';
    },
    showT: function(m) { this.toast = m; var self = this; setTimeout(function(){ self.toast=''; }, 2000); }
  }
});
</script>
</body>
</html>
