<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的</title>
  <link rel="stylesheet" href="../assets/td.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    .heat-cell { aspect-ratio:1; border-radius:3px; cursor:pointer; transition: opacity .1s; }
    .heat-cell:active { opacity: 0.7; }
    .h0 { background:var(--td-bg-page); border:1px solid var(--td-border); }
    .h1 { background:#D0D0D0; }
    .h2 { background:#888; }
    .h3 { background:#1a1a1a; }
    .h-today { box-shadow:0 0 0 2px var(--td-text-1); }
    .h-selected { outline: 2px solid var(--td-text-1); outline-offset: 1px; }
  </style>
</head>
<body style="display:flex;flex-direction:column;height:100vh;overflow:hidden;background:var(--td-bg-page);">
<div id="app" v-cloak style="display:flex;flex-direction:column;height:100%;">

  <!-- NavBar（无返回键，主 Tab 页） -->
  <div class="td-navbar">
    <div class="td-statusbar"></div>
    <div class="td-navbar-content">
      <span class="td-navbar-title">我的</span>
      <div class="td-navbar-action" @click="showT('设置功能开发中')"><i class="fas fa-cog"></i></div>
    </div>
  </div>

  <!-- ══ 未登录态 ══ -->
  <template v-if="!loggedIn">
    <div style="flex:1;overflow-y:auto;display:flex;flex-direction:column;" class="no-sb">

      <!-- Hero 占位 -->
      <div class="td-hero" style="padding:28px 16px 28px;display:flex;flex-direction:column;align-items:center;text-align:center;">
        <!-- 头像占位 -->
        <div style="width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,0.12);border:2px dashed rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;margin-bottom:14px;">
          <i class="fas fa-user" style="font-size:26px;color:rgba(255,255,255,0.35);"></i>
        </div>
        <div class="td-hero-muted" style="font-size:14px;margin-bottom:6px;">登录后查看个人打卡数据</div>
        <div class="td-hero-muted" style="font-size:12px;opacity:0.6;margin-bottom:20px;">连续天数、热力日历、打卡记录</div>
        <!-- 微信登录按钮 -->
        <button @click="loggedIn=true; showT('登录成功！')"
          style="height:44px;padding:0 28px;background:#fff;color:#1a1a1a;border:none;border-radius:22px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 2px 8px rgba(0,0,0,0.18);">
          <i class="fab fa-weixin" style="font-size:18px;color:#07C160;"></i>
          微信一键登录
        </button>
      </div>

      <!-- 功能预览（锁定状态） -->
      <div style="background:var(--td-bg-card);margin-top:8px;border-top:1px solid var(--td-border);border-bottom:1px solid var(--td-border);">
        <div v-for="item in lockedCells" :key="item.label"
          style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--td-border);opacity:0.4;">
          <div class="td-cell-icon"><i :class="'fas '+item.icon"></i></div>
          <div style="flex:1;">
            <div class="td-cell-title">{{ item.label }}</div>
            <div class="td-cell-note">{{ item.note }}</div>
          </div>
          <i class="fas fa-lock" style="font-size:12px;color:var(--td-text-4);"></i>
        </div>
      </div>

      <!-- 引导说明 -->
      <div style="padding:24px 16px;text-align:center;">
        <div style="font-size:12px;color:var(--td-text-4);line-height:1.8;">
          登录后可查看打卡热力图<br>
          追踪连续打卡天数与完成率<br>
          以及所有历史打卡记录
        </div>
      </div>

      <div style="height:8px;flex:1;"></div>
    </div>
  </template>

  <!-- ══ 已登录态 ══ -->
  <template v-else>
  <div style="flex:1;overflow-y:auto;" class="no-sb">

    <!-- Hero：用户信息 + 统计数据（同一底色，与打卡项详情页风格一致） -->
    <div class="td-hero" style="padding:20px 16px 20px;">
      <!-- 用户信息行 -->
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px;">
        <div style="width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,0.15);border:2px solid rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;">😊</div>
        <div class="td-hero-text" style="font-size:20px;font-weight:700;">小明</div>
      </div>
      <!-- 统计三格（半透明卡片，与打卡项详情页保持一致） -->
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">
        <div class="td-hero-card">
          <div class="td-hero-text" style="font-size:22px;font-weight:800;">12</div>
          <div class="td-hero-muted" style="font-size:11px;margin-top:3px;">连续天数</div>
        </div>
        <div class="td-hero-card">
          <div class="td-hero-text" style="font-size:22px;font-weight:800;">47</div>
          <div class="td-hero-muted" style="font-size:11px;margin-top:3px;">累计天数</div>
        </div>
        <div class="td-hero-card">
          <div class="td-hero-text" style="font-size:22px;font-weight:800;">86%</div>
          <div class="td-hero-muted" style="font-size:11px;margin-top:3px;">本月完成率</div>
        </div>
      </div>
    </div>

    <!-- 热力图日历 -->
    <div style="background:var(--td-bg-card);padding:14px 16px;border-bottom:1px solid var(--td-border);">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <span style="font-size:13px;font-weight:600;color:var(--td-text-1);">{{ currentMonth }} 打卡热力图</span>
        <div style="display:flex;align-items:center;gap:3px;font-size:10px;color:var(--td-text-3);">
          <span>少</span>
          <div style="width:9px;height:9px;border-radius:2px;" class="h0"></div>
          <div style="width:9px;height:9px;border-radius:2px;" class="h1"></div>
          <div style="width:9px;height:9px;border-radius:2px;" class="h2"></div>
          <div style="width:9px;height:9px;border-radius:2px;" class="h3"></div>
          <span>多</span>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px;">
        <div v-for="w in ['日','一','二','三','四','五','六']" :key="w" style="text-align:center;font-size:9px;color:var(--td-text-3);">{{ w }}</div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;">
        <div v-for="c in cells" :key="c.k"
          class="heat-cell"
          :class="['h'+c.heat, c.today?'h-today':'', c.d===selDay?'h-selected':'']"
          :style="!c.d?'opacity:0;pointer-events:none':''"
          @click="c.d&&selectDay(c)">
          <div v-if="c.d" style="text-align:center;font-size:8px;padding-top:1px;color:rgba(0,0,0,0.35);line-height:1;">{{ c.d }}</div>
        </div>
      </div>
      <!-- 当日记录面板（始终显示，默认今天） -->
      <div v-if="sel" style="margin-top:10px;background:var(--td-bg-page);border-radius:var(--td-radius-m);padding:10px;border:1px solid var(--td-border);">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span style="font-size:12px;font-weight:600;color:var(--td-text-1);">{{ sel.label }}</span>
          <span style="font-size:11px;color:var(--td-text-3);">共 {{ sel.recs.length }} 条</span>
        </div>
        <!-- 有记录 -->
        <template v-if="sel.recs.length">
          <div v-for="r in sel.recs" :key="r.n" style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--td-border);">
            <span style="font-size:16px;">{{ r.icon }}</span>
            <div style="flex:1;">
              <div style="font-size:12px;font-weight:600;color:var(--td-text-1);">{{ r.n }}</div>
              <div style="font-size:11px;color:var(--td-text-3);margin-top:1px;">{{ r.t }}{{ r.th ? ' · ' + r.th : '' }}</div>
            </div>
            <i class="fas fa-check-circle" style="color:var(--td-text-2);font-size:14px;flex-shrink:0;"></i>
          </div>
        </template>
        <!-- 空态 -->
        <div v-else style="padding:10px 0;text-align:center;">
          <i class="fas fa-calendar-xmark" style="font-size:22px;color:var(--td-text-4);margin-bottom:6px;display:block;"></i>
          <span style="font-size:12px;color:var(--td-text-3);">这天暂无打卡记录</span>
        </div>
      </div>
    </div>

    <div class="td-divider-space"></div>

    <!-- 功能菜单 -->
    <div style="background:var(--td-bg-card);">
      <div class="td-cell" @click="_nav('poster')">
        <div class="td-cell-icon"><i class="fas fa-palette"></i></div>
        <div class="td-cell-body">
          <div class="td-cell-title">生成我的海报</div>
          <div class="td-cell-note">生成打卡成就海报并分享</div>
        </div>
        <i class="fas fa-chevron-right td-cell-right"></i>
      </div>
      <div class="td-cell" @click="_nav('my-history')">
        <div class="td-cell-icon"><i class="fas fa-clipboard-list"></i></div>
        <div class="td-cell-body">
          <div class="td-cell-title">全部打卡记录</div>
          <div class="td-cell-note">查看历史打卡详情</div>
        </div>
        <i class="fas fa-chevron-right td-cell-right"></i>
      </div>
    </div>

    <div style="height:8px;"></div>
  </div>
  </template>

  <!-- TabBar：今日 | 打卡项 | 我的 -->
  <div class="td-tabbar">
    <div class="td-tab-item" @click="_nav('home')"><i class="fas fa-list-check"></i><span>今日</span></div>
    <div class="td-tab-item" @click="_nav('checkin-list')"><i class="fas fa-border-all"></i><span>打卡项</span></div>
    <div class="td-tab-item active"><i class="fas fa-user"></i><span>我的</span></div>
  </div>

  <div v-if="toast" class="td-toast">{{ toast }}</div>
</div>
<script src="../assets/js/vue.js"></script>
<script>
function _nav(p) { if (window.parent !== window) window.parent.postMessage({ navigate: p }, '*'); }
new Vue({
  el: '#app',
  data() {
    const today = new Date().getDate();
    const month = new Date().getMonth() + 1;
    return {
      loggedIn: location.search.indexOf('login=0') < 0,
      lockedCells: [
        { icon:'fa-fire',          label:'连续打卡',     note:'查看连续打卡天数与最长记录' },
        { icon:'fa-calendar-days', label:'打卡热力图',   note:'按月追踪每日打卡情况' },
        { icon:'fa-palette',       label:'生成我的海报', note:'生成打卡成就海报并分享' },
        { icon:'fa-clipboard-list',label:'全部打卡记录', note:'查看历史打卡详情' },
      ],
      toast: '',
      sel: null,
      selDay: today,
      recs: {
        [today]: [
          { icon:'💧', n:'每日喝水2000ml', t:'09:32', th:'' },
          { icon:'🧘', n:'冥想10分钟', t:'08:15', th:'今天冥想很专注' },
        ],
        8:  [{ icon:'📚', n:'每日阅读30分钟', t:'07:30', th:'读完了第5章' }],
        10: [{ icon:'📚', n:'每日阅读30分钟', t:'08:00', th:'' }, { icon:'🏃', n:'晨跑5公里', t:'07:10', th:'配速530' }],
        12: [{ icon:'📚', n:'每日阅读30分钟', t:'21:00', th:'' }, { icon:'💪', n:'健身打卡', t:'19:30', th:'练了肩部' }],
      },
      todayMonth: month,
    };
  },
  computed: {
    currentMonth() { const d = new Date(); return `${d.getFullYear()}年${d.getMonth()+1}月`; },
    cells() {
      const now = new Date(), y = now.getFullYear(), m = now.getMonth();
      const fd = new Date(y,m,1).getDay(), dim = new Date(y,m+1,0).getDate();
      const cs = [];
      for (let i=0; i<fd; i++) cs.push({ k:'e'+i, d:0, heat:0, today:false });
      const hs = [0,1,2,3,2,1,3,0,1,2,3,1,2,0,1,3,2,1,0,2,3,1,2,3,2,1,0,1,2,3,1];
      for (let d=1; d<=dim; d++) cs.push({ k:d, d, heat:d<=now.getDate()?hs[(d-1)%hs.length]:0, today:d===now.getDate() });
      return cs;
    }
  },
  mounted() {
    // 默认选中今天
    const today = new Date().getDate();
    this.selDay = today;
    const rs = this.recs[today] || [];
    this.sel = { label:`${this.todayMonth}月${today}日的打卡记录`, recs: rs };
  },
  methods: {
    selectDay(c) {
      if (!c.d) return;
      this.selDay = c.d;
      const rs = this.recs[c.d] || [];
      this.sel = { label:`${this.todayMonth}月${c.d}日的打卡记录`, recs: rs };
    },
    showT(m) { this.toast = m; setTimeout(() => this.toast = '', 2000); }
  }
});
</script>
</body>
</html>
