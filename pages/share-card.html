<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>分享卡片</title>
  <link rel="stylesheet" href="../assets/td.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    /* 微信聊天背景 */
    .wechat-bg { background: #EDEDED; }

    /* 聊天气泡（右侧/发送方） */
    .bubble-right {
      display: flex; justify-content: flex-end;
      align-items: flex-start; gap: 8px; margin-bottom: 20px;
    }
    .bubble-left {
      display: flex; justify-content: flex-start;
      align-items: flex-start; gap: 8px; margin-bottom: 20px;
    }
    .chat-avatar {
      width: 40px; height: 40px; border-radius: 6px;
      background: var(--td-bg-card); border: 1px solid var(--td-border);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
    }
    .chat-name { font-size: 11px; color: #888; margin-bottom: 4px; }

    /* 分享卡片主体 */
    .share-card {
      width: 224px; background: #fff;
      border-radius: 8px; overflow: hidden;
      box-shadow: 0 1px 6px rgba(0,0,0,0.12);
      cursor: pointer;
    }
    .share-card:active { opacity: 0.88; }

    /* 微信小程序图标（SVG 简化版） */
    .mp-icon {
      width: 16px; height: 16px; flex-shrink: 0;
    }

    /* 封面图内文字 */
    .cover-title {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 28px 10px 10px;
      background: linear-gradient(to top, rgba(0,0,0,0.55) 0%, transparent 100%);
    }

    /* 日期选择器区域 */
    .day-chip {
      display: inline-block; padding: 2px 10px; border-radius: 100px;
      background: var(--td-bg-hover); border: 1px solid var(--td-border);
      font-size: 12px; color: var(--td-text-2); cursor: pointer;
      margin-right: 6px; margin-bottom: 6px;
    }
    .day-chip.active { background: var(--td-text-1); color: #fff; border-color: var(--td-text-1); }
  </style>
</head>
<body style="display:flex;flex-direction:column;height:100vh;overflow:hidden;background:var(--td-bg-page);">
<div id="app" v-cloak style="display:flex;flex-direction:column;height:100%;">

  <!-- NavBar -->
  <div class="td-navbar">
    <div class="td-statusbar"></div>
    <div class="td-navbar-content">
      <div class="td-navbar-back" @click="_nav('checkin-detail')">
        <i class="fas fa-chevron-left"></i>
      </div>
      <span class="td-navbar-title">分享卡片预览</span>
    </div>
  </div>

  <!-- 说明栏 -->
  <div style="background:var(--td-bg-card);padding:10px 16px;border-bottom:1px solid var(--td-border);display:flex;align-items:center;gap:8px;">
    <i class="fas fa-circle-info" style="font-size:12px;color:var(--td-text-3);"></i>
    <span style="font-size:12px;color:var(--td-text-3);">此卡片将在微信群/对话中展示，点击可进入打卡项详情</span>
  </div>

  <!-- 聊天模拟区（可滚动） -->
  <div style="flex:1;overflow-y:auto;padding:16px 16px 24px;" class="wechat-bg no-sb">

    <!-- 时间戳 -->
    <div style="text-align:center;margin-bottom:16px;">
      <span style="font-size:11px;color:#aaa;background:rgba(0,0,0,0.06);padding:2px 10px;border-radius:100px;">今天 16:15</span>
    </div>

    <!-- 我分享出去（右侧） -->
    <div class="bubble-right">
      <div>
        <div style="text-align:right;" class="chat-name">小明（我）</div>
        <!-- 分享卡片 -->
        <div class="share-card" @click="_nav('checkin-detail')">
          <!-- 应用标识行 -->
          <div style="padding:10px 12px 6px;display:flex;align-items:center;gap:7px;border-bottom:1px solid #f2f2f2;">
            <div style="width:20px;height:20px;border-radius:4px;background:#1a1a1a;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
              <span style="font-size:9px;font-weight:900;color:#fff;">止</span>
            </div>
            <span style="font-size:12px;font-weight:600;color:#555;letter-spacing:0.2px;">止观实验室</span>
          </div>
          <!-- 卡片标题 -->
          <div style="padding:9px 12px 8px;">
            <div style="font-size:15px;font-weight:600;color:#1a1a1a;line-height:1.4;">{{ cards[curCard].title }}</div>
          </div>
          <!-- 封面图 -->
          <div :style="'height:128px;background:'+cards[curCard].bg+';position:relative;overflow:hidden;'">
            <!-- 底部渐变遮罩 + 项目名 -->
            <div class="cover-title">
              <div style="font-size:13px;font-weight:700;color:#fff;line-height:1.35;text-shadow:0 1px 4px rgba(0,0,0,0.4);">{{ cards[curCard].name }}</div>
            </div>
            <!-- 止观实验室 logo -->
            <div style="position:absolute;top:8px;left:10px;display:flex;align-items:center;gap:4px;">
              <div style="width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,0.9);display:flex;align-items:center;justify-content:center;">
                <span style="font-size:7px;font-weight:900;color:#222;">止</span>
              </div>
              <span style="font-size:10px;font-weight:600;color:rgba(255,255,255,0.85);">止观实验室</span>
            </div>
          </div>
          <!-- 小程序标识 -->
          <div style="padding:7px 12px;display:flex;align-items:center;gap:5px;border-top:1px solid #f2f2f2;">
            <svg class="mp-icon" viewBox="0 0 24 24" fill="none">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z" fill="#07C160" opacity="0.15"/>
              <path d="M8.5 14.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm7 0c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z" fill="#07C160"/>
            </svg>
            <span style="font-size:11px;color:#888;">小程序</span>
          </div>
        </div>
      </div>
      <!-- 我的头像 -->
      <div class="chat-avatar">😊</div>
    </div>

    <!-- 分隔说明 -->
    <div style="text-align:center;margin:8px 0 20px;">
      <span style="font-size:11px;color:#aaa;background:rgba(0,0,0,0.06);padding:2px 10px;border-radius:100px;">以下为群友收到卡片的效果</span>
    </div>

    <!-- 群友收到（左侧） -->
    <div class="bubble-left">
      <div class="chat-avatar">🌸</div>
      <div>
        <div class="chat-name">小花</div>
        <div class="share-card" @click="_nav('checkin-detail')">
          <div style="padding:10px 12px 6px;display:flex;align-items:center;gap:7px;border-bottom:1px solid #f2f2f2;">
            <div style="width:20px;height:20px;border-radius:4px;background:#1a1a1a;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
              <span style="font-size:9px;font-weight:900;color:#fff;">止</span>
            </div>
            <span style="font-size:12px;font-weight:600;color:#555;">止观实验室</span>
          </div>
          <div style="padding:9px 12px 8px;">
            <div style="font-size:15px;font-weight:600;color:#1a1a1a;line-height:1.4;">{{ cards[curCard].title }}</div>
          </div>
          <div :style="'height:128px;background:'+cards[curCard].bg+';position:relative;overflow:hidden;'">
            <div class="cover-title">
              <div style="font-size:13px;font-weight:700;color:#fff;line-height:1.35;text-shadow:0 1px 4px rgba(0,0,0,0.4);">{{ cards[curCard].name }}</div>
            </div>
            <div style="position:absolute;top:8px;left:10px;display:flex;align-items:center;gap:4px;">
              <div style="width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,0.9);display:flex;align-items:center;justify-content:center;">
                <span style="font-size:7px;font-weight:900;color:#222;">止</span>
              </div>
              <span style="font-size:10px;font-weight:600;color:rgba(255,255,255,0.85);">止观实验室</span>
            </div>
          </div>
          <div style="padding:7px 12px;display:flex;align-items:center;gap:5px;border-top:1px solid #f2f2f2;">
            <svg class="mp-icon" viewBox="0 0 24 24" fill="none">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z" fill="#07C160" opacity="0.15"/>
              <path d="M8.5 14.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm7 0c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z" fill="#07C160"/>
            </svg>
            <span style="font-size:11px;color:#888;">小程序</span>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- 底部：切换示例卡片 -->
  <div style="background:var(--td-bg-card);padding:12px 16px;border-top:1px solid var(--td-border);flex-shrink:0;">
    <div style="font-size:11px;color:var(--td-text-3);margin-bottom:8px;">切换示例场景</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;">
      <span v-for="(c,i) in cards" :key="i"
        class="day-chip" :class="curCard===i?'active':''"
        @click="curCard=i">{{ c.label }}</span>
    </div>
  </div>

  <div v-if="toast" class="td-toast">{{ toast }}</div>
</div>
<script src="../assets/js/vue.js"></script>
<script>
function _nav(p) { if (window.parent !== window) window.parent.postMessage({ navigate: p }, '*'); }
new Vue({
  el: '#app',
  data: {
    toast: '',
    curCard: 0,
    cards: [
      {
        label: '打卡提醒',
        title: '每日阅读30分钟，打卡第12天',
        name: '每日阅读30分钟',
        bg: 'linear-gradient(135deg,#1a1a2e 0%,#16213e 55%,#0f3460 100%)',
      },
      {
        label: '邀请加入',
        title: '邀请你加入：每日阅读30分钟',
        name: '每日阅读30分钟',
        bg: 'linear-gradient(135deg,#1f4037 0%,#2c6e49 100%)',
      },
      {
        label: '打卡成功',
        title: '我完成了今日打卡！连续12天',
        name: '每日阅读30分钟',
        bg: 'linear-gradient(135deg,#2d1b69 0%,#11998e 100%)',
      },
    ],
  },
  methods: {
    showT(m) { this.toast = m; setTimeout(() => this.toast = '', 2000); }
  }
});
</script>
</body>
</html>
